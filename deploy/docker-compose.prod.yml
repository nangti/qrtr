# Production: pulls the CI-built image from GHCR instead of building locally.
# One-time VPS setup in docs/DEPLOY-NODOMAIN.md. Then:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
services:
  app:
    image: ghcr.io/nangti/qrtr:latest
    environment:
      BASE_URL: ${BASE_URL:-https://${DOMAIN}}
      COOKIE_SECURE: "1"
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
      SCAN_RETENTION_DAYS: ${SCAN_RETENTION_DAYS:-90}
      DATA_DIR: /data
    volumes:
      - qrtr-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. qrtr-you.duckdns.org}
      APP_DOMAIN: ${APP_DOMAIN:-${DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  # Continuous SQLite backup → B2/S3 (10 GB free). Uncomment after following §5 of the guide.
  # litestream:
  #   image: litestream/litestream
  #   volumes: [qrtr-data:/data, ./litestream.yml:/etc/litestream.yml]
  #   restart: unless-stopped

volumes:
  qrtr-data:
  caddy-data:
  caddy-config:
