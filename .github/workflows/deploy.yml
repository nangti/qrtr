name: deploy
# Manual for now — enable the push trigger once your VPS exists (docs/DEPLOY-NODOMAIN.md §4):
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: pull & restart on VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} '
            set -e
            cd ~/qrtr
            git pull --ff-only
            docker compose -f deploy/docker-compose.prod.yml --env-file .env pull
            docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
            for i in $(seq 1 20); do curl -sf http://localhost:8080/healthz && exit 0; sleep 3; done
            echo "health check failed" >&2; exit 1'
