name: deploy
# Manual for now — enable the push trigger once your VPS exists (docs/DEPLOY-NODOMAIN.md §4):
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Raw ssh instead of a third-party ssh-agent action: zero version
      # deprecation surface, zero supply-chain deps beyond the runner itself.
      - name: pull & restart on VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/qrtr_deploy
          chmod 600 ~/.ssh/qrtr_deploy
          ssh -i ~/.ssh/qrtr_deploy -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" '
            set -e
            cd ~/qrtr
            git pull --ff-only
            docker compose -f deploy/docker-compose.prod.yml --env-file .env pull
            docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
            ok=""
            for i in $(seq 1 20); do
              curl -sf http://localhost:8080/healthz && { ok=1; break; } || sleep 3
            done
            [ -n "$ok" ] || { echo "post-deploy health check failed" >&2; exit 1; }'
