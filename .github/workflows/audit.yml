name: audit
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC — catches CVEs disclosed after our last push

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install deps + audit tool
        run: |
          pip install -r requirements.txt
          pip install pip-audit
      - name: audit declared dependencies
        run: pip-audit -r requirements.txt --strict
      # Note: app/static/chart.umd.js is a vendored single file (Chart.js v4),
      # not a dependency tree — it is not covered by pip-audit; review when
      # bumping it manually (it has no known CVEs as of v4.5.x).
