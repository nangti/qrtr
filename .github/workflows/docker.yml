name: docker
on:
  push:
    branches: [main, arena/01a08c18-qrtr]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to GitHub Container Registry (free for this repo)

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # emulate ARM for Oracle's Ampere chips
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64   # amd64 = Hetzner/Intel · arm64 = Oracle free tier
          push: true
          tags: |
            ghcr.io/nangti/qrtr:${{ github.sha }}
            ghcr.io/nangti/qrtr:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
